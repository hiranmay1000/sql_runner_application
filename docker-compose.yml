services:
  backend:
    build:
      context: ./backend
    container_name: sql_runner_backend
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: PROD
      PORT: 8000
      DATABASE_URL: app/sql_runner.db
      MONGO_URI: "mongodb+srv://hiranmay1000:Jupiter%408-3do@appx-cluster.9dfkgfm.mongodb.net/?appName=appx-cluster"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python app/app.py"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE: "http://127.0.0.1:8000/api"
    container_name: sql_runner_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
